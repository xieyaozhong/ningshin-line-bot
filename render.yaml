services:
  - type: web
    name: ningshin-line-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: THREADS_ACCESS_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AUDIO_TTL_SECONDS
        value: "900"
      - key: MAX_USER_TEXT
        value: "3000"
